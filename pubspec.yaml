name: kazi
description: Kazi — local services marketplace for the DRC.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Routing / deep links
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  firebase_app_check: ^0.3.1+3

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # i18n
  intl: ^0.20.0

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Contact / sharing
  url_launcher: ^6.3.1
  share_plus: ^10.1.1

  # Phone numbers
  phone_numbers_parser: ^5.0.0+1

  # OTP input
  pinput: ^5.0.0

  # Icons
  lucide_icons_flutter: ^4.0.3

  # Device / misc
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.1
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.1
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat[wght].ttf
        - asset: assets/fonts/Montserrat-Italic[wght].ttf
          style: italic
